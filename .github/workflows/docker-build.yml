name: Build and Push Docker Image

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write


    steps:
      - name: Debug
        run: |
          echo "Hello, ${{ github.actor }}!"
          SECRET_VALUE=${{ secrets.GITHUB_TOKEN }}
          echo "SECRET_VALUE=$SECRET_VALUE"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Login
        run: echo "Login successful to ghcr.io"

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=short
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract SHA tag from docker metadata
        id: extract_tag
        run: |
          TAG=$(echo "${{ steps.meta.outputs.tags }}" | grep -o 'sha-[^,]*' | head -n1)
          echo "Extracted tag: $TAG"
          echo "new_tag=$TAG" >> $GITHUB_OUTPUT

      - name: Install kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin

      - name: Setup SSH key for GitLab
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.GITLAB_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan gitlab.com >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Clone GitLab repo and update mapserver tag
        run: |
          git clone git@gitlab.com:wftech/project-vumop/czechinvest-deployments.git gitlab-repo
          cd gitlab-repo/prod-cib/overlays/prod

          NEW_TAG=${{ steps.extract_tag.outputs.new_tag }}
          echo "Setting mapserver tag to: $NEW_TAG"

          kustomize edit set image registry.local/mapserver=ghcr.io/vumop/mapserver:$NEW_TAG

          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add kustomization.yml
          git commit -m "Update mapserver image tag to $NEW_TAG [CI]"
#          git push origin main